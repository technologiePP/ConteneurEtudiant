#price .lines span b{color:var(--ink)}

label.f{display:block;margin:8px 0 2px;color:var(--mut);font-size:12px}
input[type=number],input[type=range]{width:100%}
input[type=number]{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.row{display:flex;gap:6px}.row>*{flex:1}

function blocked(px,pz){const R=22;if(px<R||px>L-R||pz<R||pz>W-R)return true;
 const inDoor=items.some(o=>{if(!o.def.part)return false;const r=o.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r),dx=px-o.x,dz=pz-o.z;return Math.abs(dx*c-dz*s)<=o.w/2-5&&Math.abs(dx*s+dz*c)<=24});

function buildSTL(sc){const k=1000/sc,t=Math.max(.05,1.2/k),Lm=L/100,Wm=W/100,Hm=H/100,tri=[],v=new THREE.Vector3(),P=(x,y,z)=>[(x+t)*k,(Wm+t-z)*k,(y+t)*k];

 for(let i=0;i<tri.length;i+=3){const a=tri[i],b=tri[i+1],c=tri[i+2],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],l=Math.hypot(n[0],n[1],n[2])||1;[n[0]/l,n[1]/l,n[2]/l,...a,...b,...c].forEach(x=>{dv.setFloat32(o,x,true);o+=4});o+=2}
